name: Repository Validation

on:
  push:
  pull_request:

jobs:
  validate:
    name: Pharmacy product analytical quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate analytical and publication contract
        run: python scripts/validate_repository.py

      - name: Verify deterministic reproducibility
        run: python scripts/check_reproducibility.py

      - name: Compile Python sources
        run: python -m compileall -q scripts
